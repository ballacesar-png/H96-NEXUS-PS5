name: Crear APK H96 NEXUS PS5

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extraer proyecto
        run: unzip -q H96_NEXUS_PS5_Proyecto.zip -d proyecto

      - name: Compilar APK
        run: gradle assembleDebug
        working-directory: proyecto/H96_NEXUS_PS5

      - uses: actions/upload-artifact@v4
        with:
          name: H96-NEXUS-PS5-APK
          path: proyecto/H96_NEXUS_PS5/app/build/outputs/apk/debug/app-debug.apk
